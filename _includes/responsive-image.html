{% assign img_src = include.src %}
{% assign img_alt = include.alt | default: "" %}
{% assign img_class = include.class | default: "full-width" %}

<a href="/assets/images/{{ img_src }}" class="lightbox-link">
  <img src="/assets/images/{{ img_src }}" 
       alt="{{ img_alt }}" 
       class="{{ img_class }}" 
       loading="lazy">
</a>
