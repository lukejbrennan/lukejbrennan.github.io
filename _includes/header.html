        <a class="page-link" href="/about/">About</a>
        <a class="page-link" href="/categories/">All Posts</a>
        <button id="darkModeToggle">🌙 Toggle Dark Mode</button>
      </div>
    </nav>
  </div>
  <script>
  const toggle = document.getElementById('darkModeToggle');

  // Load saved preference or system preference
  const savedTheme = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
    document.body.classList.add('dark-mode');
    toggle.textContent = '✨☀️✨'; // sun shows when dark mode is on
  } else {
    toggle.textContent = '✨🌙✨'; // moon shows in light mode
  }

  // Toggle dark mode✨
  toggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      toggle.textContent = '✨☀️✨';   // sun when dark
      localStorage.setItem('theme', 'dark');
    } else {
      toggle.textContent = '✨🌙✨';   // moon when light
      localStorage.setItem('theme', 'light');
    }
  });
</script>
