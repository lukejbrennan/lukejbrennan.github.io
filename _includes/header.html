      </div>
    </nav>
  </div>
  <script>
  // Shared by every .dark-mode-toggle button on the page (the mobile header's
  // and the desktop rail's). Delegated on document + re-queried at paint time
  // rather than cached on load, since the rail's button lives in a later
  // include and doesn't exist yet when this script (in header.html) runs.
  const savedTheme = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let dark = savedTheme === 'dark' || (!savedTheme && prefersDark);

  function paint() {
    document.body.classList.toggle('dark-mode', dark);
    document.querySelectorAll('.dark-mode-toggle').forEach((t) => {
      t.textContent = dark ? '✨☀️✨' : '✨🌙✨';
    });
  }

  document.addEventListener('DOMContentLoaded', paint);
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.dark-mode-toggle')) return;
    dark = !dark;
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    paint();
  });
</script>
