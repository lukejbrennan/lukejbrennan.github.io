<div class="zg-search-overlay" id="zgSearchOverlay">
  <div class="zg-search-modal" role="dialog" aria-modal="true" aria-label="Search notes">
    <div class="zg-search-modal-input-row">
      <span class="zg-mono" aria-hidden="true">✂</span>
      <input type="text" id="zgSearchInput" placeholder="Search notes…" aria-label="Search notes" autocomplete="off" />
      <button type="button" class="zg-search-close" id="zgSearchClose" aria-label="Close search"><kbd>esc</kbd></button>
    </div>
    <div class="zg-search-modal-body">
      <ul class="zg-search-modal-list" id="zgSearchList" role="listbox"></ul>
      <div class="zg-search-modal-preview" id="zgSearchPreview"></div>
    </div>
  </div>
</div>
